# nginx for the Silente landing page (spec §7.2). Static files only.
# Runs as an unprivileged user on a read-only root: everything nginx writes
# goes to /tmp (a tmpfs in the compose).
#
# Traefik's publico@file middleware already sets X-Content-Type-Options,
# X-Frame-Options, Referrer-Policy and Permissions-Policy, and compresses.
# Only what it does not add is set here (security-headers.conf).

worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    proxy_temp_path /tmp/proxy_temp;
    client_body_temp_path /tmp/client_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    charset utf-8;
    charset_types text/plain text/css text/xml image/svg+xml;  # text/html is always included

    server_tokens off;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;

    # The client address comes from Traefik (shared proxy network).
    set_real_ip_from 172.30.0.0/24;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Logs without the full IP (last IPv4 octet to 0, IPv6 cut to /48) and
    # without User-Agent or Referer: consistent with "no tracking".
    map $remote_addr $remote_addr_anon {
        ~^(?<a>\d+\.\d+\.\d+)\.\d+$         $a.0;
        ~^(?<b>[0-9a-fA-F]*:[0-9a-fA-F]*:[0-9a-fA-F]*):  $b::;
        default                             -;
    }
    log_format anon '$remote_addr_anon [$time_local] "$request" $status $body_bytes_sent $request_time';
    access_log /dev/stdout anon;

    # Only GET and HEAD (spec §7.2); a 405 says what is allowed.
    map $request_method $method_allowed {
        GET     1;
        HEAD    1;
        default 0;
    }
    map $method_allowed $allow_header {
        0       "GET, HEAD";
        default "";
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        # Relative Location headers: behind Traefik the public scheme and
        # host are not this server's.
        absolute_redirect off;
        autoindex off;

        if ($method_allowed = 0) {
            return 405;
        }

        error_page 404 /404.html;

        include /etc/nginx/security-headers.conf;

        # Pages: canonical URLs without extension (spec §6.1).
        location / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files $uri $uri.html =404;
        }

        location = / {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
            try_files /index.html =404;
        }

        # /privacidad.html → /privacidad, /index.html → /
        location = /index.html {
            return 301 /$is_args$args;
        }
        location = /index {
            return 301 /$is_args$args;
        }
        location ~ ^(?<page>/.+)\.html$ {
            return 301 $page$is_args$args;
        }
        # /privacidad/ → /privacidad
        location ~ ^(?<page>/.+)/$ {
            return 301 $page$is_args$args;
        }

        # The 404 page is only served as an error, never as a page.
        location = /404.html {
            internal;
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-cache" always;
        }
        location = /404 {
            return 404;
        }

        # Hashed assets: cached for a year.
        location ^~ /assets/ {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            try_files $uri =404;
        }

        # Healthcheck (compose) and Uptime Kuma.
        location = /salud {
            include /etc/nginx/security-headers.conf;
            add_header Cache-Control "no-store" always;
            default_type text/plain;
            access_log off;
            try_files /salud =404;
        }

        # Hidden files, never.
        location ~ /\. {
            deny all;
        }
    }
}
